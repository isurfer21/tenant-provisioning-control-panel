name: tpcp
services:
  nats:
    image: nats:2.10-alpine
    container_name: tpcp-nats-1
    command: ["-c", "/etc/nats-config/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/var/lib/nats
      - ./nats-jetstream.conf:/etc/nats-config/nats.conf:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: tpcp-api:latest
    container_name: tpcp-server-1
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_PATH: /app/data/tenant.db
      NATS_URL: nats://nats:4222
      LOG_LEVEL: INFO
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - nats

  worker-sim:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: tpcp-worker-sim:latest
    container_name: tpcp-sim-1
    environment:
      PORT: 8081
      DB_PATH: /app/data/tenant.db
      NATS_URL: nats://nats:4222
      FAIL_RATE: 0.2
      MIN_DELAY_MS: 500
      MAX_DELAY_MS: 3000
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - nats

volumes:
  nats-data:
  sqlite-data:
